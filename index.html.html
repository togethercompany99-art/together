@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f5f2; --surface:#ffffff; --surface2:#e9ede8; --glass:rgba(255,255,255,.7); --fg:#0d1416; --muted:#55636a; --line:rgba(13,20,22,.11);
  --cam:#07857a; --cut:#b05d00; --on-accent:#ffffff; --glow-cam:rgba(7,133,122,.16); --glow-cut:rgba(176,93,0,.13); --grain:.05; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f5f2; --surface:#ffffff; --surface2:#e9ede8; --glass:rgba(255,255,255,.7); --fg:#0d1416; --muted:#55636a; --line:rgba(13,20,22,.11);
  --cam:#07857a; --cut:#b05d00; --on-accent:#ffffff; --glow-cam:rgba(7,133,122,.16); --glow-cut:rgba(176,93,0,.13); --grain:.05; color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;padding-inline:16px;overflow-x:clip;position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:var(--grain);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay}
#app{max-width:1180px;margin-inline:auto}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}a{color:inherit}
:focus-visible{outline:2px solid var(--cam);outline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
section{padding-block:clamp(56px,9vw,110px)}
.kicker{font-family:var(--mono);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cam);direction:ltr;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.kicker::after{content:"";width:34px;height:1px;background:var(--cam)}
h2{font-size:clamp(1.9rem,5vw,3.2rem);font-weight:700;line-height:1.2}
.sec-head{display:flex;flex-direction:column;gap:12px;margin-bottom:40px}
.sec-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.rv{transform:translateY(26px);transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{transform:none}

/* nav */
.navwrap{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;margin-top:12px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px 8px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:.95rem;direction:ltr;padding-inline-start:8px}
.mk{display:inline-block;width:34px;height:30px;background:var(--fg);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
.lg{display:block;background:var(--fg);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;width:min(100%,420px);aspect-ratio:700/491;margin-inline:auto}
nav .links{display:flex;gap:6px;font-size:.95rem}
nav .links a{text-decoration:none;color:var(--muted);padding:6px 16px;border-radius:99px;transition:background .2s,color .2s}
nav .links a:hover{color:var(--fg);background:var(--surface2)}
@media(max-width:700px){nav .links{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:500;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);background:var(--surface2)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#06220f;font-weight:600}
.btn-wa:hover{background:var(--wa);filter:brightness(1.07);box-shadow:0 10px 30px -8px rgba(37,211,102,.55)}
.btn.sm{padding:8px 18px;font-size:.9rem}.btn.lg2{padding:16px 32px;font-size:1.1rem}
.btn svg{width:20px;height:20px;flex:none}

/* hero */
.hero{position:relative;padding-block:clamp(40px,7vw,90px) clamp(40px,6vw,70px);--mx:50%;--my:30%}
.aurora{position:absolute;inset:-120px -20vw 0;overflow:hidden;pointer-events:none;z-index:-1;-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px)}
.aurora i:nth-child(1){width:46vw;height:46vw;max-width:560px;max-height:560px;inset-inline-end:8%;top:0;background:var(--glow-cam);animation:drift 16s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:40vw;height:40vw;max-width:480px;max-height:480px;inset-inline-start:6%;top:120px;background:var(--glow-cut);animation:drift 20s ease-in-out infinite alternate-reverse}
.aurora::after{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx) var(--my),var(--glow-cam),transparent 70%)}
@keyframes drift{to{transform:translate3d(40px,60px,0) scale(1.15)}}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,56px);align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:10px;padding:6px 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;direction:ltr;color:var(--muted)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cam);box-shadow:0 0 0 0 var(--cam);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
h1{font-size:clamp(2rem,5.4vw,4.1rem);font-weight:700;line-height:1.12;margin-block:22px 20px}
h1 span{display:block}
h1 .s0{background:linear-gradient(100deg,var(--cam),color-mix(in srgb,var(--cam) 55%,var(--fg)));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .s1{background:linear-gradient(100deg,var(--cut),color-mix(in srgb,var(--cut) 55%,var(--fg)));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:1.12rem;max-width:44ch}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.panel-glass{position:relative;border-radius:28px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:clamp(20px,3vw,34px) clamp(18px,3vw,30px) 22px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.stage{position:relative;direction:ltr;margin-top:34px}
.playhead{position:absolute;top:0;bottom:-6px;left:58%;width:2px;background:var(--fg);z-index:2;border-radius:2px;animation:scrub 9s ease-in-out infinite alternate}
@keyframes scrub{from{left:14%}to{left:88%}}
.playhead::before{content:"";position:absolute;top:-4px;left:-6px;width:14px;height:12px;background:var(--fg);clip-path:polygon(0 0,100% 0,50% 100%)}
.tc{position:absolute;top:-24px;left:10px;font-size:.74rem;color:var(--muted);letter-spacing:.1em}
.tracks{display:grid;gap:6px;margin-top:10px}
.track{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.track span{font-size:.62rem;color:var(--muted);letter-spacing:.1em}
.lane{height:30px;border-radius:7px;background:color-mix(in srgb,var(--fg) 5%,transparent);display:flex;gap:4px;padding:3px;overflow:hidden}
.clip{border-radius:4px;flex:none}
.cam .clip{background:var(--cam)}.cut .clip{background:var(--cut)}.clip.dim{opacity:.35}
.cap{display:flex;justify-content:space-between;margin-top:18px;font-size:.7rem;letter-spacing:.14em;color:var(--muted);direction:ltr}

.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:18px;direction:ltr;margin-inline:-16px;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marquee div{display:flex;gap:44px;width:max-content;animation:mq 34s linear infinite;font-family:var(--head);font-size:clamp(1.3rem,3vw,2rem);font-weight:600;color:var(--muted);white-space:nowrap}
.marquee b{color:var(--cam);font-weight:400}.marquee b:nth-of-type(even){color:var(--cut)}
@keyframes mq{to{transform:translateX(-50%)}}

/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.cell{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:clamp(22px,3vw,34px);min-width:0;display:flex;flex-direction:column;gap:14px}
.cell.c3{grid-column:span 3}.cell.c2{grid-column:span 2}.cell.c6{grid-column:span 6}.cell.c4{grid-column:span 4}
@media(max-width:860px){.cell.c3,.cell.c2,.cell.c4{grid-column:span 6}}
.cell.svc::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(70px);inset-inline-end:-100px;top:-120px;opacity:.9;transition:transform .6s}
.cell.svc.cam::before{background:var(--glow-cam)}.cell.svc.cut::before{background:var(--glow-cut)}
.cell.svc:hover::before{transform:scale(1.35)}
.cell>*{position:relative}
.ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;border:1px solid currentColor}
.ico svg{width:26px;height:26px}
.cam .ico,.cam h3{color:var(--cam)}.cut .ico,.cut h3{color:var(--cut)}
.cell h3{font-size:1.7rem;font-weight:700}
.cell p{color:var(--muted)}
.lead-chip{margin-top:auto;display:inline-flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.lead-chip b{color:var(--fg);font-weight:500}
.lead-chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.cam .lead-chip i{background:var(--cam)}.cut .lead-chip i{background:var(--cut)}
.about-t{font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.8;color:var(--fg);font-family:var(--head);font-weight:400}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.step{padding:24px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.step .n{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px var(--muted);direction:ltr;align-self:flex-start}
.step h3{font-size:1.2rem}.step p{color:var(--muted);font-size:.95rem}

/* works */
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:5px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.chip{border:0;background:transparent;border-radius:99px;padding:8px 22px;cursor:pointer;transition:background .2s}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.work{position:relative;border-radius:24px;overflow:hidden;background:var(--surface2);aspect-ratio:4/5;display:block;text-decoration:none;min-width:0;isolation:isolate}
.work:first-child:not(.add){grid-column:span 2;aspect-ratio:auto;min-height:420px}
@media(max-width:700px){.work:first-child:not(.add){grid-column:span 1;aspect-ratio:4/5;min-height:0}}
.work img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1);z-index:-2}
.work:hover img{transform:scale(1.07)}
.work .noimg{position:absolute;inset:0;z-index:-2;background:linear-gradient(135deg,var(--glow-cam),var(--glow-cut)),var(--surface2)}
.work::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(4,8,9,.88),rgba(4,8,9,.15) 55%,transparent)}
.work .meta{position:absolute;inset-inline:0;bottom:0;padding:22px;display:flex;flex-direction:column;gap:6px;color:#f1f4f3}
.work h3{font-size:1.3rem;font-weight:600}.work p{font-size:.92rem;opacity:.8}
.tagk{align-self:flex-start;font-size:.78rem;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:inline-flex;gap:8px;align-items:center}
.tagk::before{content:"";width:7px;height:7px;border-radius:50%;background:#3de0cb}.tagk.edit::before{background:#ffab3d}
.play{position:absolute;top:18px;inset-inline-start:18px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff;transition:transform .3s}
.work:hover .play{transform:scale(1.12)}.play svg{width:20px;height:20px}
.empty-box{border:1px dashed var(--line);border-radius:24px;padding:56px 20px;text-align:center;color:var(--muted)}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.person{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.pic{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--surface2)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.person:hover .pic img{transform:scale(1.05)}
.mono-avatar{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:6rem;color:var(--cam);background:radial-gradient(circle at 30% 20%,var(--glow-cam),transparent 60%),var(--surface2)}
.person.edit .mono-avatar{color:var(--cut);background:radial-gradient(circle at 30% 20%,var(--glow-cut),transparent 60%),var(--surface2)}
.pic .lead{position:absolute;top:14px;inset-inline-start:14px;font-size:.78rem;padding:3px 12px;border-radius:99px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff}
.person .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:4px;flex:1}
.person h3{font-size:1.25rem}.person .role{font-size:.92rem;color:var(--cam)}.person.edit .role{color:var(--cut)}
.person p{color:var(--muted);font-size:.93rem}


/* contact */
.contact{position:relative;overflow:hidden;border-radius:34px;border:1px solid var(--line);background:var(--surface);padding:clamp(28px,6vw,72px);display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center}
@media(max-width:860px){.contact{grid-template-columns:1fr}}
.contact::before,.contact::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);pointer-events:none}
.contact::before{background:var(--glow-cam);inset-inline-end:-120px;top:-160px}.contact::after{background:var(--glow-cut);inset-inline-start:-140px;bottom:-200px}
.contact>*{position:relative}
.contact h2{font-size:clamp(2rem,5.5vw,3.8rem);margin-block:12px 16px}
.contact .sub{margin-bottom:26px}
.num{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.num .mono{font-size:1.5rem;letter-spacing:.06em}
footer{padding-block:32px 120px;color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;color:#06220f;box-shadow:0 10px 30px -6px rgba(37,211,102,.6);z-index:20;transition:transform .2s}
.fab{border:0;cursor:pointer}.fab:hover{transform:scale(1.08)}.fab svg{width:30px;height:30px}

/* admin */
.tools{position:absolute;top:12px;inset-inline-end:12px;display:flex;gap:6px;z-index:5}
.tools button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:.85rem;cursor:pointer}
.add{border:1.5px dashed var(--cam);background:transparent;border-radius:24px;min-height:200px;display:grid;place-items:center;cursor:pointer;color:var(--cam);font-weight:500;padding:20px}
.adminbar{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:60;padding-inline:16px;pointer-events:none}
.adminbar .in{pointer-events:auto;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.45);max-width:100%}
.adminbar .st{font-size:.85rem;color:var(--muted);padding-inline:6px}
.btn.cam{background:var(--cam);border-color:var(--cam);color:var(--on-accent);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:90;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:24px;width:min(520px,100%);padding:26px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 8px);overflow:auto}
.modal label{display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--muted)}
.modal input[type=text],.modal input[type=url],.modal select,.modal textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--fg);width:100%}
.modal textarea{min-height:90px;resize:vertical}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.modal .check{flex-direction:row;align-items:center;gap:10px}
.preview{max-height:150px;border-radius:12px;object-fit:cover;align-self:flex-start}
.danger{color:#ff7a70;border-color:currentColor;background:transparent}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));inset-inline:16px;margin-inline:auto;width:fit-content;max-width:100%;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:120}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script id="state" type="application/json">{"settings":{"phone":"201142858580","display":"01142858580","tagline":"التصوير بيلقط اللحظة. المونتاج بيحكيها. وإحنا الاتنين مع بعض.","about":"Together فريق ميديا صغير بيشتغل على الصورة والمونتاج في مكان واحد. مصطفى مسؤول التصوير، وهادي هشام مسؤول المونتاج، والشغل بيطلع متناسق من أول لقطة لآخر كَت"},"team":[{"id":"m1","name":"مصطفى","role":"مسؤول التصوير","kind":"photo","lead":true,"bio":"بيقود فريق التصوير ويظبط كل لقطة قبل ما توصل للمونتاج.","photo":""},{"id":"h1","name":"هادي هشام","role":"مسؤول المونتاج","kind":"edit","lead":true,"bio":"بيقص ويركّب ويظبط الألوان والصوت لحد ما الفيديو يتقفل.","photo":""}],"works":[]}</script>
<script id="main">
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const WA='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.45 15.03L2 22l5.1-1.55A9.9 9.9 0 1 0 12.04 2zm0 1.8a8.1 8.1 0 1 1-4.2 15.03l-.3-.18-3 .9.92-2.92-.2-.31A8.1 8.1 0 0 1 12.04 3.8zm-3.1 3.9c-.2 0-.5.07-.76.35-.26.28-1 .98-1 2.4s1.03 2.78 1.17 2.97c.15.2 2 3.2 4.94 4.36 2.45.96 2.95.77 3.48.72.53-.05 1.7-.7 1.94-1.37.24-.68.24-1.26.17-1.38-.07-.12-.26-.2-.55-.34-.28-.15-1.7-.84-1.96-.93-.27-.1-.46-.15-.65.14-.2.29-.75.93-.92 1.12-.17.2-.34.22-.63.07-.29-.14-1.22-.45-2.32-1.43-.86-.76-1.44-1.7-1.6-1.99-.17-.29-.02-.45.13-.6.13-.13.29-.34.43-.5.15-.17.2-.29.29-.48.1-.2.05-.36-.02-.5-.07-.15-.65-1.6-.9-2.18-.23-.56-.47-.48-.65-.49h-.55z"/></svg>';
const ICAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.2l1.4-2h6.8l1.4 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.8"/></svg>';
const ICUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>';
const IPLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';

let saved=JSON.parse($('#state').textContent);
let draft=JSON.parse(JSON.stringify(saved));
const hosted=!!(window.claude&&window.claude.use);
let local=false;
let canEdit=false,editing=false,filter='all',modal=null,busy=false,artifact=null;
const dirty=()=>JSON.stringify(draft)!==JSON.stringify(saved);
const waLink=t=>'https://wa.me/'+draft.settings.phone+'?text='+encodeURIComponent(t);
const KIND={photo:'تصوير',edit:'مونتاج'};

function clips(w){return w.map((x,i)=>'<div class="clip'+(i%3==2?' dim':'')+'" style="width:'+x+'%"></div>').join('')}
function workCard(w,i){
  const tools=editing?'<div class="tools"><button data-act="edit-work" data-id="'+w.id+'">تعديل</button></div>':'';
  const k=w.kind==='edit'?'edit':'photo';
  const img=w.img?'<img loading="lazy" alt="'+esc(w.title)+'" src="'+w.img+'">':'<div class="noimg"></div>';
  const inner=img+(k==='edit'&&w.link?'<span class="play">'+IPLAY+'</span>':'')+'<div class="meta"><span class="tagk '+(k==='edit'?'edit':'')+'">'+KIND[k]+'</span><h3>'+esc(w.title)+'</h3>'+(w.desc?'<p>'+esc(w.desc)+'</p>':'')+'</div>';
  if(w.link&&!editing)return '<a class="work rv" target="_blank" rel="noopener" href="'+esc(w.link)+'">'+inner+'</a>';
  return '<div class="work rv">'+tools+inner+'</div>';
}
function personCard(p){
  const tools=editing?'<div class="tools"><button data-act="edit-member" data-id="'+p.id+'">تعديل</button></div>':'';
  const pic=p.photo?'<img loading="lazy" alt="'+esc(p.name)+'" src="'+p.photo+'">':'<div class="mono-avatar">'+esc([...p.name][0]||'?')+'</div>';
  return '<article class="person rv '+(p.kind==='edit'?'edit':'')+'">'+tools+'<div class="pic">'+pic+(p.lead?'<span class="lead">مسؤول القسم</span>':'')+'</div><div class="body"><h3>'+esc(p.name)+'</h3><span class="role">'+esc(p.role)+'</span>'+(p.bio?'<p>'+esc(p.bio)+'</p>':'')+'</div></article>';
}
function render(){
  const s=draft.settings,lead=k=>draft.team.find(p=>p.kind===k&&p.lead);
  const lp=lead('photo'),le=lead('edit');
  const works=draft.works.filter(w=>filter==='all'||w.kind===filter);
  const chip=(k,l)=>'<button class="chip" data-act="filter" data-k="'+k+'" aria-pressed="'+(filter===k)+'">'+l+'</button>';
  const sents=s.tagline.split(/[.。]\s*/).map(x=>x.trim()).filter(Boolean);
  const h1=sents.map((x,i)=>'<span class="s'+Math.min(i,2)+'">'+esc(x)+(i<sents.length-1?'.':'')+'</span>').join('');
  const mq=['تصوير','مونتاج','ريلز','إعلانات','مناسبات','ألوان وصوت','محتوى'].map(x=>'<span>'+x+'</span><b>✦</b>').join('');
  const wa0=waLink('أهلاً Together، عايز أتواصل مع خدمة العملاء');
  $('#app').innerHTML=
  '<div class="navwrap"><nav><a class="logo" href="#top" aria-label="Together"><span class="mk"></span><span>together</span></a><div class="links"><a href="#about">عنّا</a><a href="#work">الشغل</a><a href="#team">الفريق</a><a href="#contact">تواصل</a></div><button class="btn btn-wa sm" data-act="cs-open">'+WA+'خدمة العملاء</button></nav></div>'+
  '<header class="hero" id="top"><div class="aurora" aria-hidden="true"><i></i><i></i></div><div class="hero-grid"><div><span class="badge">MEDIA / PHOTOGRAPHY / EDITING</span><h1>'+h1+'</h1><p class="sub">شركة ميديا للتصوير والمونتاج. قولنا الفكرة وإحنا نوصّلها من أول لقطة لآخر كَت.</p><div class="actions"><button class="btn btn-wa lg2" data-act="cs-open">'+WA+'خدمة العملاء</button><a class="btn lg2" href="#work">شوف شغلنا</a></div></div>'+
  '<div class="panel-glass" aria-hidden="true"><div class="lg"></div><div class="stage"><div class="playhead"><span class="tc mono" id="tc">00:00:00:00</span></div><div class="tracks"><div class="track cam"><span class="mono">CAM</span><div class="lane">'+clips([22,14,9,18,12,10])+'</div></div><div class="track cut"><span class="mono">CUT</span><div class="lane">'+clips([12,19,8,24,11,14])+'</div></div></div></div><div class="cap mono"><span>TEAM OF '+draft.team.length+'</span><span>25 FPS</span></div></div></div></header>'+
  '<div class="marquee" aria-hidden="true"><div>'+mq+mq+mq+mq+'</div></div>'+
  '<section id="about"><div class="sec-head"><div class="kicker">about</div><h2>مين إحنا <span class="g">وبنعمل إيه</span></h2></div><div class="bento">'+
  '<div class="cell c6 rv"><p class="about-t">'+esc(s.about)+'</p></div>'+
  '<div class="cell svc cam c3 rv"><span class="ico">'+ICAM+'</span><h3>التصوير</h3><p>فيديو وصور للإعلانات والمناسبات والمحتوى، بفكرة واضحة قبل ما الكاميرا تفتح.</p>'+(lp?'<span class="lead-chip"><i></i>مسؤول القسم <b>'+esc(lp.name)+'</b></span>':'')+'</div>'+
  '<div class="cell svc cut c3 rv"><span class="ico">'+ICUT+'</span><h3>المونتاج</h3><p>قص وتركيب وتصحيح ألوان وصوت للفيديوهات والريلز والإعلانات لحد التسليم النهائي.</p>'+(le?'<span class="lead-chip"><i></i>مسؤول القسم <b>'+esc(le.name)+'</b></span>':'')+'</div></div>'+
  '<div class="steps" style="margin-top:16px">'+[['01','الفكرة','نفهم هدفك ونحدد شكل الفيديو أو الصور قبل التصوير.'],['02','التصوير','الفريق ينزل بالمعدات ويصوّر اللقطات المطلوبة.'],['03','المونتاج','قص وتركيب وألوان وصوت لحد ما الشغل يجهز.'],['04','التسليم','نسلّمك الملفات بالصيغ اللي محتاجها.']].map(x=>'<div class="step rv"><span class="n">'+x[0]+'</span><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div>').join('')+'</div></section>'+
  '<section id="work"><div class="sec-head"><div class="kicker">portfolio</div><h2>أعمالنا</h2></div><div class="grid">'+
  (editing?'<button class="add" data-act="add-work">+ إضافة شغل جديد</button>':'')+works.map(workCard).join('')+'</div>'+
  (!works.length&&!editing?'<div class="empty-box">الأعمال جاية قريب. كلمنا على واتساب ونبعتلك نماذج من شغلنا.</div>':'')+'</section>'+
  '<section id="team"><div class="sec-head"><div class="kicker">crew</div><h2>الفريق <span class="g">اللي وراء الكاميرا</span></h2></div><div class="team">'+
  draft.team.map(personCard).join('')+(editing?'<button class="add" data-act="add-member">+ إضافة مصور أو مونتير</button>':'')+'</div></section>'+
  '<section id="contact" style="padding-top:0"><div class="contact rv"><div><div class="kicker" style="justify-content:flex-start">customer service</div><h2>عندك فكرة؟ <span class="g">خلينا نبدأ.</span></h2><p class="sub">اضغط على خدمة العملاء، اكتب بياناتك ونفتحلك واتساب برسالة جاهزة.</p><button class="btn btn-wa lg2" data-act="cs-open">'+WA+'خدمة العملاء</button></div><div class="lg" style="width:260px;max-width:100%" aria-hidden="true"></div></div></section>'+
  '<footer><span class="logo"><span class="mk"></span></span><span>تصوير · مونتاج · Together</span></footer>'+
  '<button class="fab" data-act="cs-open" aria-label="خدمة العملاء">'+WA+'</button>';
  renderBar();observe();
}
let io=null;
function observe(){
  const els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{rootMargin:'0px 0px -6% 0px'});
  els.forEach(e=>io.observe(e));
}
function renderBar(){
  let b=$('#bar');if(!b){b=document.createElement('div');b.id='bar';document.body.appendChild(b)}
  if(!canEdit){b.innerHTML='';return}
  const d=dirty();
  if(local){try{if(d)localStorage.setItem('together-draft',JSON.stringify({base:JSON.stringify(saved),draft:draft}));else localStorage.removeItem('together-draft')}catch(e){}}
  b.innerHTML='<div class="adminbar"><div class="in"><button class="btn sm" data-act="toggle">'+(editing?'إنهاء التعديل':'وضع التحكم')+'</button>'+
   (editing?'<button class="btn sm" data-act="settings">إعدادات الموقع</button>':'')+
   (local?
     (d?'<span class="st">التعديلات عندك بس لحد ما ترفع الملف على GitHub</span><button class="btn sm" data-act="discard">تراجع</button><button class="btn sm cam" data-act="export">تصدير الملف</button>':'<span class="st">وضع التحكم شغال، ابدأ بالتعديل</span>')+'<button class="btn sm" data-act="exit">خروج</button>':
     (d?'<span class="st">فيه تغييرات لسه ما اتنشرتش</span><button class="btn sm" data-act="discard">تراجع</button><button class="btn sm cam" data-act="save"'+(busy?' disabled':'')+'>'+(busy?'بينشر...':'حفظ ونشر')+'</button>':'<span class="st">كل حاجة منشورة</span>'))+
   '</div></div>';
}
function buildFile(){
  const reset=(document.head.querySelector('style:not(#css)')||{}).textContent||'';
  const json=JSON.stringify(draft).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<meta name="description" content="Together - شركة ميديا للتصوير والمونتاج">\n<style>'+reset+'</style>\n<title>'+document.title+'</title>\n'+$('#fonts').outerHTML+'\n<style id="css">'+$('#css').textContent+'</style>\n</head>\n<body>\n<div id="app"></div>\n<script id="state" type="application/json">'+json+'<\/script>\n<script id="main">'+$('#main').textContent+'<\/script>\n</body>\n</html>\n';
}
function exportFile(){
  const blob=new Blob([buildFile()],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('نزل index.html. ارفعه على GitHub مكان القديم');
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function toDataUrl(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>rej(new Error('img'));im.src=u})}

function openModal(type,id){
  const isW=type==='work',list=isW?draft.works:draft.team,item=id?list.find(x=>x.id===id):null;
  modal={type,id,img:item?(isW?item.img:item.photo):''};
  let f='';
  if(type==='settings'){const s=draft.settings;
    f='<h3>إعدادات الموقع</h3><label>الجملة الرئيسية (كل جملة تنتهي بنقطة بتظهر في سطر)<textarea id="f-tag">'+esc(s.tagline)+'</textarea></label><label>نبذة عنكم<textarea id="f-about">'+esc(s.about)+'</textarea></label><label>رقم الواتساب بصيغة دولية (بدون + أو أصفار)<input type="text" id="f-phone" dir="ltr" value="'+esc(s.phone)+'"></label><label>الرقم كما يظهر للزوار<input type="text" id="f-disp" dir="ltr" value="'+esc(s.display)+'"></label>';
  }else if(isW){
    f='<h3>'+(item?'تعديل الشغل':'شغل جديد')+'</h3><label>العنوان<input type="text" id="f-title" required value="'+esc(item?item.title:'')+'"></label><label>النوع<select id="f-kind"><option value="photo"'+(item&&item.kind==='photo'?' selected':'')+'>تصوير</option><option value="edit"'+(item&&item.kind==='edit'?' selected':'')+'>مونتاج</option></select></label><label>وصف قصير (اختياري)<textarea id="f-desc">'+esc(item?item.desc:'')+'</textarea></label><label>رابط الفيديو أو الشغل (يوتيوب، إنستجرام، درايف...)<input type="url" id="f-link" dir="ltr" value="'+esc(item?item.link:'')+'"></label><label>صورة الغلاف<input type="file" id="f-file" accept="image/*"></label>';
  }else{
    f='<h3>'+(item?'تعديل البروفايل':'عضو جديد')+'</h3><label>الاسم<input type="text" id="f-name" required value="'+esc(item?item.name:'')+'"></label><label>الوظيفة<input type="text" id="f-role" placeholder="مصور، مونتير، ..." value="'+esc(item?item.role:'')+'"></label><label>القسم<select id="f-kind"><option value="photo"'+(item&&item.kind==='photo'?' selected':'')+'>تصوير</option><option value="edit"'+(item&&item.kind==='edit'?' selected':'')+'>مونتاج</option></select></label><label class="check"><input type="checkbox" id="f-lead"'+(item&&item.lead?' checked':'')+'> مسؤول القسم</label><label>نبذة<textarea id="f-bio">'+esc(item?item.bio:'')+'</textarea></label><label>الصورة الشخصية<input type="file" id="f-file" accept="image/*"></label>';
  }
  const prev=type==='settings'?'':'<img class="preview" id="f-prev" alt="" '+(modal.img?'src="'+modal.img+'"':'hidden')+'>';
  const del=item&&!(type==='member'&&item.lead)?'<button type="button" class="btn sm danger" data-act="del" id="f-del">حذف</button>':'<span></span>';
  const ov=document.createElement('div');ov.className='overlay';ov.id='ov';
  ov.innerHTML='<form class="modal" id="mform">'+f+prev+'<div class="row">'+del+'<span style="display:flex;gap:8px"><button type="button" class="btn sm" data-act="close">إلغاء</button><button type="submit" class="btn sm cam">تم</button></span></div></form>';
  document.body.appendChild(ov);
  const file=$('#f-file');
  if(file)file.addEventListener('change',async()=>{const fl=file.files[0];if(!fl)return;try{modal.img=await toDataUrl(fl,isW?1400:900,.8);const p=$('#f-prev');p.src=modal.img;p.hidden=false}catch(e){toast('الصورة دي مش مدعومة، جرب صورة تانية')}});
  $('#mform').addEventListener('submit',e=>{e.preventDefault();submitModal(item)});
}
function closeModal(){const o=$('#ov');if(o)o.remove();modal=null}
function submitModal(item){
  const v=i=>($(i)||{}).value||'';
  if(modal.type==='settings'){const s=draft.settings;s.tagline=v('#f-tag').trim()||s.tagline;s.about=v('#f-about').trim();const ph=v('#f-phone').replace(/\D/g,'');if(ph)s.phone=ph;s.display=v('#f-disp').trim()||s.display}
  else if(modal.type==='work'){const o={id:item?item.id:uid(),title:v('#f-title').trim(),kind:v('#f-kind'),desc:v('#f-desc').trim(),link:v('#f-link').trim(),img:modal.img};if(!o.title){toast('اكتب عنوان للشغل');return}if(item)Object.assign(item,o);else draft.works.unshift(o)}
  else{const o={id:item?item.id:uid(),name:v('#f-name').trim(),role:v('#f-role').trim()||'مصور',kind:v('#f-kind'),lead:$('#f-lead').checked,bio:v('#f-bio').trim(),photo:modal.img};if(!o.name){toast('اكتب الاسم');return}if(item)Object.assign(item,o);else draft.team.push(o)}
  closeModal();render();
}
function buildDoc(){
  const reset=(document.head.querySelector('style')||{}).textContent||'';
  const json=JSON.stringify(draft).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
   '<title>'+document.title+'</title>'+$('#fonts').outerHTML+'<style id="css">'+$('#css').textContent+'</style><div id="app"></div><script id="state" type="application/json">'+json+'<\/script><script id="main">'+$('#main').textContent+'<\/script></body></html>';
}
async function save(){
  if(busy||!artifact)return;
  const doc=buildDoc();
  if(doc.length>14e6){toast('الصور كبيرة قوي، قلل عددها أو استخدم صور أصغر');return}
  busy=true;renderBar();
  try{await artifact.publish(doc)}
  catch(e){busy=false;renderBar();toast(e&&e.code==='conflict'?'حد عدّل الموقع قبلك، الصفحة هتتحدث':'ماقدرناش ننشر، حاول تاني')}
}
function csMsg(){
  const v=i=>($(i)||{}).value||'';
  const L=['أهلاً Together، أنا '+v('#cs-name').trim()+'.','نوع الشغل: '+v('#cs-type'),'الإيميل: '+v('#cs-mail').trim(),'السوشيال ميديا: '+(v('#cs-soc').trim()||'مفيش'),v('#cs-note').trim()?'تفاصيل: '+v('#cs-note').trim():''];
  return L.filter(Boolean).join('\n');
}
function csCheck(){
  const v=i=>($(i)||{}).value||'';
  if(!v('#cs-name').trim())return 'اكتب اسمك';
  if(!v('#cs-type'))return 'اختار نوع الشغل اللي عايزه';
  if(!/^\S+@\S+\.\S+$/.test(v('#cs-mail').trim()))return 'اكتب إيميل صحيح';
  return '';
}
function updateCS(){const a=$('#cs-send');if(a)a.href=waLink(csMsg())}
function closeCS(){const o=$('#cs');if(o)o.remove()}
function openCS(){
  if($('#cs'))return;
  const types=['ريلز','إعلان','فيديو تعريفي للشركة','تصوير منتجات','تصوير مناسبة أو حدث','مونتاج فيديو جاهز','حاجة تانية'];
  const ov=document.createElement('div');ov.className='overlay';ov.id='cs';
  ov.innerHTML='<form class="modal" id="csform" novalidate><h3>خدمة العملاء</h3><p style="color:var(--muted);font-size:.95rem">اكتب بياناتك وهنفتحلك واتساب برسالة جاهزة فيها كل التفاصيل.</p><label>اسمك<input type="text" id="cs-name" autocomplete="name"></label><label>عايز إيه؟<select id="cs-type"><option value="">اختار نوع الشغل</option>'+types.map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>الإيميل<input type="text" id="cs-mail" dir="ltr" inputmode="email" autocomplete="email" placeholder="name@example.com"></label><label>حسابات السوشيال ميديا اللي بتعرض عليها شغلك (لو عندك)<input type="text" id="cs-soc" dir="ltr" placeholder="لينك إنستجرام / تيك توك / يوتيوب"></label><label>تفاصيل تانية (اختياري)<textarea id="cs-note"></textarea></label><p id="cs-err" style="color:#ff7a70;font-size:.9rem;margin:0" hidden></p><div class="row"><button type="button" class="btn sm" data-act="cs-close">إلغاء</button><a id="cs-send" class="btn btn-wa" target="_blank" rel="noopener" href="#">'+WA+'ابعت على واتساب</a></div></form>';
  ov.addEventListener('click',e=>{if(e.target===ov)closeCS()});
  document.body.appendChild(ov);updateCS();$('#cs-name').focus();
}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#csform')){updateCS();const r=$('#cs-err');if(r)r.hidden=true}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCS()});
document.addEventListener('click',e=>{
  const a=e.target.closest('#cs-send');if(!a)return;
  const err=csCheck();
  if(err){e.preventDefault();const r=$('#cs-err');r.textContent=err;r.hidden=false;return}
  updateCS();setTimeout(closeCS,400);
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='cs-open')openCS();
  else if(a==='cs-close')closeCS();
  else if(a==='toggle'){editing=!editing;render()}
  else if(a==='add-work')openModal('work');
  else if(a==='edit-work')openModal('work',id);
  else if(a==='add-member')openModal('member');
  else if(a==='edit-member')openModal('member',id);
  else if(a==='settings')openModal('settings');
  else if(a==='close')closeModal();
  else if(a==='discard'){draft=JSON.parse(JSON.stringify(saved));render()}
  else if(a==='save')save();
  else if(a==='export')exportFile();
  else if(a==='exit'){try{localStorage.removeItem('together-draft')}catch(e){}location.hash='';location.reload()}
  else if(a==='del'){
    if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='اضغط تاني للتأكيد';return}
    const m=modal;if(m.type==='work')draft.works=draft.works.filter(x=>x.id!==m.id);else draft.team=draft.team.filter(x=>x.id!==m.id);closeModal();render();
  }
  else if(a==='copy'){const n=draft.settings.display;(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast('تم نسخ الرقم'),()=>{const r=document.createRange();r.selectNodeContents($('#numtxt'));const s=getSelection();s.removeAllRanges();s.addRange(r)})}
});
if(!hosted&&location.hash==='#admin'){canEdit=true;local=true;try{const r=JSON.parse(localStorage.getItem('together-draft')||'null');if(r&&r.base===JSON.stringify(saved))draft=r.draft}catch(e){}}
addEventListener('hashchange',()=>location.reload());
render();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!still){
  let f=0;setInterval(()=>{const el=$('#tc');if(!el)return;f++;const p=n=>String(n).padStart(2,'0');el.textContent='00:00:'+p(Math.floor(f/25)%60)+':'+p(f%25)},40);
  document.addEventListener('pointermove',e=>{const h=$('.hero');if(!h)return;const r=h.getBoundingClientRect();h.style.setProperty('--mx',(e.clientX-r.left)+'px');h.style.setProperty('--my',(e.clientY-r.top)+'px')});
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [a,u]=await Promise.all([window.claude.use('artifact'),window.claude.use('user')]);
    artifact=a;canEdit=!!(a&&u&&u.canEdit&&u.canEdit());
    renderBar();
  }catch(e){}
})();
})();
</script>

</body>
